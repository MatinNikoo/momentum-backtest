name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: tests (offline, synthetic data plus the committed snapshots)
        run: python -m pytest
      - name: quick run of the study plumbing
        run: python run_study.py --quick --no-figures --no-write
