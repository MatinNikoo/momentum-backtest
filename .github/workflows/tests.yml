name: tests

on:
  push:
  pull_request:

# the tests only need to read the code
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: tests (offline, synthetic data plus the committed snapshots)
        run: python -m pytest
      - name: quick run of the study plumbing
        run: python run_study.py --quick --no-figures --no-write
