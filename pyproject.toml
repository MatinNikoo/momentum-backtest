[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trendlab"
version = "0.3.0"
description = "Trend following backtests with no lookahead, cash at the T-bill rate and honest comparisons"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["numpy>=2.0", "pandas>=2.2", "scipy>=1.11", "matplotlib>=3.8"]

[project.optional-dependencies]
live = ["requests", "yfinance"]
dev = ["pytest", "hypothesis"]

[project.scripts]
trendlab = "trendlab.cli:main"

[tool.setuptools]
packages = ["trendlab"]
